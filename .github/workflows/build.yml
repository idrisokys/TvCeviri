name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AltyaziCikar-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Releases sayfasına koy (telefondan doğrudan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AltyaziCikar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AltyaziCikar.apk --title "Son sürüm" --notes "Otomatik derlenen APK"
